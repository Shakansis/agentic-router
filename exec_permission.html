<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Permission Block Redesign</title>
<style>
  body {
    background-color: #11111a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e2e8f0;
    padding: 40px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* ESTADO PENDENTE (AGUARDANDO AÇÃO) */
  .perm-card-pending {
    background-color: #1c1d26;
    border: 1px solid #3b82f6; /* Borda azul indica foco/ação do sistema, não erro */
    border-radius: 8px;
    overflow: hidden;
    max-width: 800px;
  }

  .perm-header {
    background-color: rgba(59, 130, 246, 0.1);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid #2a2c38;
    font-weight: 500;
    font-size: 14px;
    color: #60a5fa;
  }

  .perm-body {
    padding: 16px;
  }

  .code-block {
    background-color: #0d0d12;
    border: 1px solid #2a2c38;
    border-radius: 6px;
    padding: 12px;
    font-family: monospace;
    color: #4ade80; /* Verde estilo terminal */
    font-size: 13px;
    overflow-x: auto;
    margin-bottom: 16px;
  }

  .security-notice {
    display: flex;
    gap: 8px;
    font-size: 12px;
    color: #8b8d98; /* Cinza neutro ao invés de laranja gritante */
    align-items: flex-start;
    margin-bottom: 16px;
  }

  .perm-actions {
    display: flex;
    gap: 12px;
  }

  .btn {
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
  }

  .btn-approve {
    background-color: #3b82f6;
    color: white;
  }

  .btn-approve:hover { background-color: #2563eb; }

  .btn-deny {
    background-color: transparent;
    border: 1px solid #36394a;
    color: #a0a2b0;
  }

  .btn-deny:hover { background-color: #2a2c38; color: white; }

  /* ESTADO CONCLUÍDO (HISTÓRICO) */
  .perm-card-completed {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    max-width: 800px;
    font-size: 13px;
    color: #a0a2b0;
  }

  .completed-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .completed-icon {
    color: #4ade80; /* Check verde */
  }

  .cmd-summary {
    background-color: #1c1d26;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: monospace;
    color: #e2e8f0;
    border: 1px solid #2a2c38;
  }

  .completed-right {
    font-size: 12px;
    color: #6b7280;
  }
  
  .details-btn {
    background: none;
    border: none;
    color: #8b8d98;
    cursor: pointer;
    font-size: 12px;
    text-decoration: underline;
  }
</style>
</head>
<body>

  <!-- EXEMPLO 1: AGUARDANDO APROVAÇÃO (Foco total do usuário) -->
  <div class="perm-card-pending">
    <div class="perm-header">
      <span>🛡️</span> Action Required: Allow Node.js Execution
    </div>
    <div class="perm-body">
      <div class="code-block">
        $ node -e "const fs=require('fs'); const h=fs.readFileSync('Claude Code-2/index.html');"
      </div>
      <div class="security-notice">
        <span>ℹ️</span> 
        <span>This process runs with your local user's authority and may access files or networks outside the workspace.</span>
      </div>
      <div class="perm-actions">
        <button class="btn btn-approve">Approve & Run</button>
        <button class="btn btn-deny">Reject</button>
      </div>
    </div>
  </div>

  <!-- EXEMPLO 2: CONCLUÍDO (Minimizado, limpo, não distrai a leitura do chat) -->
  <div class="perm-card-completed">
    <div class="completed-left">
      <span class="completed-icon">✓</span>
      <span>Executed command:</span>
      <span class="cmd-summary">node --version</span>
      <button class="details-btn">View output</button>
    </div>
    <div class="completed-right">
      Completed in 0.4s
    </div>
  </div>

</body>
</html>
