<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sidebar - No Scrollbar</title>
<style>
  body {
    background-color: #11111a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e2e8f0;
    margin: 0;
    padding: 40px;
    display: flex;
    justify-content: center;
  }

  .sidebar {
    width: 300px;
    background-color: #14151c;
    border: 1px solid #2a2c38;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    padding: 16px 12px;
  }

  .project-block {
    background-color: #1a1b22;
    border-radius: 8px;
    border: 1px solid #242631;
    display: flex;
    flex-direction: column;
    position: relative; /* Necessário para posicionar o indicador flutuante */
    overflow: hidden;
  }

  .project-header {
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background-color: #1e2029;
    font-weight: 500;
    font-size: 14px;
    border-bottom: 1px solid #242631;
    z-index: 2; /* Fica acima do fade */
  }

  /* LISTA DE CONVERSAS */
  .chat-list {
    display: flex;
    flex-direction: column;
    max-height: 240px;
    overflow-y: auto;
    padding-bottom: 20px; /* Espaço para o indicador não cobrir o último item */
    
    /* Mantém o Fade out */
    -webkit-mask-image: linear-gradient(to bottom, black 75%, transparent 100%);
    mask-image: linear-gradient(to bottom, black 75%, transparent 100%);

    /* MÁGICA: ESCONDER SCROLLBARS */
    scrollbar-width: none; /* Firefox */
    -ms-overflow-style: none; /* IE e Edge */
  }

  /* Esconder no Chrome, Safari e Opera */
  .chat-list::-webkit-scrollbar {
    display: none;
  }

  .chat-item {
    padding: 10px 12px 10px 32px;
    display: flex;
    justify-content: space-between;
    border-left: 2px solid transparent;
    font-size: 13px;
  }

  .chat-item.active {
    background-color: #1e2538;
    border-left-color: #3b82f6;
    color: #ffffff;
    font-weight: 500;
  }

  .chat-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  
  .chat-date {
    font-size: 11px;
    color: #6b7280;
    font-weight: normal;
  }

  /* NOVO: INDICADOR VISUAL SUTIL (Setinha) */
  .scroll-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    color: #6b7280;
    pointer-events: none; /* Deixa o clique passar direto para a lista */
    animation: pulse 2s infinite;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: rgba(26, 27, 34, 0.6);
    border-radius: 50%;
    width: 24px;
    height: 24px;
  }

  @keyframes pulse {
    0% { transform: translate(-50%, 0); opacity: 0.5; }
    50% { transform: translate(-50%, 3px); opacity: 1; }
    100% { transform: translate(-50%, 0); opacity: 0.5; }
  }

</style>
</head>
<body>

<div class="sidebar">
  <div class="project-block">
    <div class="project-header">
      <span style="display: flex; gap: 8px;">📂 Projeto Server</span>
      <span style="color: #6b7280;">...</span>
    </div>
    
    <div class="chat-list">
      <div class="chat-item active">
        <div class="chat-info">
          <span>Crie um plano separando...</span>
          <span class="chat-date">8/30/2026</span>
        </div>
      </div>
      <div class="chat-item"><div class="chat-info"><span>Crie uma pasta com o nome</span><span class="chat-date">8/30/2026</span></div></div>
      <div class="chat-item"><div class="chat-info"><span>Explicação sobre rotas alternativas</span><span class="chat-date">8/29/2026</span></div></div>
      <div class="chat-item"><div class="chat-info"><span>Setup do banco de dados</span><span class="chat-date">8/28/2026</span></div></div>
      <div class="chat-item"><div class="chat-info"><span>Configuração do ambiente de producao...</span><span class="chat-date">8/25/2026</span></div></div>
      <div class="chat-item"><div class="chat-info"><span>Ideias iniciais de backend e integra...</span><span class="chat-date">8/20/2026</span></div></div>
    </div>

    <!-- Indicador visual (Seta animada) -->
    <div class="scroll-indicator">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </div>

  </div>
</div>

</body>
</html>
