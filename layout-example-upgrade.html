<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Router - UI Refinada</title>
    <style>
        :root {
            --bg-main: #0e0e11;
            --bg-sidebar: #141418;
            --bg-panel: #1a1a20;
            --border-color: #272730;
            --text-main: #f4f4f6;
            --text-muted: #8e929b;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --badge-bg: rgba(79, 70, 229, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        sidebar {
            width: 280px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
        }

        .brand {
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand span {
            background: var(--accent);
            color: #fff;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
        }

        .card-info {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13px;
        }

        .card-info .label {
            color: var(--text-muted);
            font-size: 11px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
        }

        /* Main Content */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        header {
            padding: 12px 24px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-sidebar);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 14px;
            font-weight: 600;
        }

        .btn {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--border-color);
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
            gap: 12px;
        }

        /* Input Box Melhorado com Respiro e Hierarquia */
        .input-area-wrapper {
            padding: 16px 24px 24px 24px;
            background: linear-gradient(to top, var(--bg-main) 80%, transparent);
        }

        .input-box {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .input-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .active-agent-pill {
            background: var(--badge-bg);
            color: #818cf8;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        textarea {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 14px;
            resize: none;
            height: 36px;
            outline: none;
            line-height: 20px;
        }

        .input-bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .controls-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        select {
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            outline: none;
        }

        .send-btn {
            background-color: var(--accent);
            border: none;
            color: white;
            padding: 6px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
        }

        .send-btn:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <sidebar>
        <div class="brand">
            <span>AR</span> Agentic Router
        </div>
        <div class="card-info">
            <div class="label">Ollama <span class="status-dot"></span></div>
            <strong>HTTP Conectado</strong>
        </div>
        <div class="card-info">
            <div class="label">Hardware Ativo</div>
            <strong>Placa 1 & Placa 2 (Multi-GPU)</strong>
        </div>
    </sidebar>

    <main>
        <header>
            <div class="header-title">Sessão Local - Khitai RPG</div>
            <div style="display: flex; gap: 8px;">
                <button class="btn">+ Nova Conversa</button>
                <button class="btn">⚙️ Configurações</button>
            </div>
        </header>

        <div class="chat-container">
            <p>Pronto para conversar. O roteador inteligente gerenciará os agentes automaticamente.</p>
        </div>

        <div class="input-area-wrapper">
            <div class="input-box">
                <!-- Barra superior indicando claramente o agente ativo -->
                <div class="input-top-bar">
                    <div class="active-agent-pill">
                        ⚡ Agente: <span id="current-agent">Auto (Roteador)</span>
                    </div>
                    <div style="color: var(--text-muted); font-size: 11px;">
                        Pressione Enter para enviar
                    </div>
                </div>

                <textarea placeholder="Envie uma mensagem ou comando para o agente..."></textarea>

                <div class="input-bottom-bar">
                    <div class="controls-group">
                        <select>
                            <option>Modo: Chat</option>
                            <option>Modo: Execute</option>
                        </select>
                        <select>
                            <option>Modelo: Auto (Roteador)</option>
                            <option>story-telling (Placa 1)</option>
                            <option>code (Placa 1)</option>
                            <option>generate-image (Placa 2)</option>
                        </select>
                    </div>
                    <button class="send-btn">Enviar</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
